name: "Socket"

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  socket:
    name: Socket (supply-chain behavior scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Socket GitHub Action
        uses: socketsecurity/socket-github-action@main
        with:
          args: --compact
