name: "CodeQL"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # 每周一凌晨 3 点例行扫描（GitHub 公共仓库免费）
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c20e34f438d671fc35777cc9820dd7adf8252874
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@c20e34f438d671fc35777cc9820dd7adf8252874

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c20e34f438d671fc35777cc9820dd7adf8252874
        with:
          category: "/language:${{matrix.language}}"
