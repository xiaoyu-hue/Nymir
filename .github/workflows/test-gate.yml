name: Test Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: audit · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E Smoke (三端：Chromium 桌面 + WebKit 手机/平板)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 官方 Playwright 镜像已预装 Chromium/WebKit/Firefox 本体与全部系统库
    # （libflite、libmanette、libgstcodecparsers、libavif、libGLESv2 等），
    # 从而彻底绕开 runner 上极慢的 apt 源（实测 5.5 分钟只下完 10 个包，
    # `playwright install-deps` 无论给多少 timeout 都装不完）。
    # ⚠️ 镜像 tag 必须与 package.json 的 @playwright/test 版本严格一致：升级 Playwright 时同步改这里。
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run E2E
        run: npx playwright test
