name: Test Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: audit · typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: E2E Smoke (三端：Chromium 桌面 + WebKit 手机/平板)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # 只下浏览器本体（走 actions/cache，命中时秒过），不碰 apt
        run: npx playwright install chromium webkit

      - name: Install Playwright system deps (best effort)
        # runner 的 apt 源（azure.archive.ubuntu.com）近期极慢：实测 5.5 分钟才下完 10 个包
        # （fonts-wqy-zenhei 7.4MB、libavcodec60 5.8MB 等），`--with-deps` 会把 job 拖死。
        # 这里只做尽力而为的补装：最多 4 分钟，超时就放弃，让 E2E 照常跑、用结果说话。
        run: timeout -k 10s 240s npx playwright install-deps chromium webkit || echo "::warning::系统依赖安装超时/失败，E2E 可能因缺少系统库失败"

      - name: Run E2E
        run: npx playwright test
