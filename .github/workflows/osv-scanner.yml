name: "OSV-Scanner"

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 每周一凌晨 3 点例行扫描
    - cron: '0 3 * * 1'

jobs:
  osv-scan:
    name: OSV (dependency vuln aggregation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/google/osv-scanner:v2.6.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run OSV-Scanner
        run: osv-scanner --recursive .
