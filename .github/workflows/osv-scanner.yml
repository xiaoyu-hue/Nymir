name: "OSV-Scanner"

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # 每周一凌晨 3 点例行扫描
    - cron: '0 3 * * 1'

jobs:
  osv-scan:
    name: OSV (dependency vuln aggregation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run OSV-Scanner (v2.6.0 release binary)
        run: |
          curl -sSL "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64" -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner scan source -r .
